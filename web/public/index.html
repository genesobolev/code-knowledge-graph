<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore recorded repository and query knowledge graphs, then compare retrieval quality.">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0f172a">
    <title>Code Knowledge Graph</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/vendor/plotly.min.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="app-identity" href="#view=repository" aria-label="Code Knowledge Graph repository view">
                <span class="brand-mark" aria-hidden="true">ckg</span>
                <strong>Code Knowledge Graph</strong>
            </a>
            <nav class="view-switcher" aria-label="Primary views">
                <button id="repository-control" type="button" data-view="repository" aria-pressed="true" aria-controls="repository-view">Repository</button>
                <button id="query-control" type="button" data-view="query" aria-pressed="false" aria-controls="query-view">Query</button>
                <button id="comparison-control" type="button" data-view="comparison" aria-pressed="false" aria-controls="comparison-view">Comparison</button>
            </nav>
        </header>

        <main class="app-main" id="app-main">
            <p id="loading-state" class="loading-state" role="status">Loading recorded figures…</p>
            <p id="error-state" class="error-state" role="alert" hidden></p>

            <section id="repository-view" class="app-view" aria-labelledby="repository-control" data-view-panel="repository" hidden>
                <div class="plot-frame" role="region" aria-label="Repository file relationship figure" tabindex="0">
                    <div id="repository-figure" class="plot-host plot-host-repository"></div>
                </div>
                <footer id="repository-provenance" class="provenance"></footer>
            </section>

            <section id="query-view" class="app-view" aria-labelledby="query-control" data-view-panel="query" hidden>
                <div class="query-toolbar">
                    <label for="query-select">Query</label>
                    <select id="query-select" aria-describedby="query-question query-description"></select>
                    <p id="query-question" class="visually-hidden" aria-live="polite"></p>
                    <p id="query-description" class="visually-hidden"></p>
                </div>
                <div class="plot-frame" role="region" aria-label="Selected query relationship figure" tabindex="0">
                    <div id="query-figure" class="plot-host plot-host-query"></div>
                </div>
                <footer id="query-provenance" class="provenance"></footer>
            </section>

            <section id="comparison-view" class="app-view comparison-view" aria-labelledby="comparison-control" data-view-panel="comparison" hidden>
                <div class="table-frame aggregate-frame" tabindex="0" role="region" aria-label="Scrollable aggregate retrieval comparison">
                    <table>
                        <caption>Aggregate retrieval</caption>
                        <thead>
                            <tr>
                                <th scope="col">Metric</th>
                                <th scope="col">Lexical</th>
                                <th scope="col">Graph-expanded</th>
                                <th scope="col">Change</th>
                            </tr>
                        </thead>
                        <tbody id="aggregate-table-body"></tbody>
                    </table>
                </div>
                <p id="comparison-conclusion" class="comparison-conclusion"></p>

                <div class="table-frame comparison-table-frame" tabindex="0" role="region" aria-label="Scrollable per-query retrieval comparison">
                    <table>
                        <caption>Per-query retrieval</caption>
                        <thead>
                            <tr>
                                <th scope="col">Query</th>
                                <th scope="col">Answer rank<br><span>L / G</span></th>
                                <th scope="col">RR at 10<br><span>L / G</span></th>
                                <th scope="col">Recall at 10<br><span>L / G</span></th>
                                <th scope="col">Recall at 20<br><span>L / G</span></th>
                                <th scope="col">Supporting recall at 10<br><span>L / G</span></th>
                                <th scope="col">Reviewed changes</th>
                                <th scope="col">Regression</th>
                            </tr>
                        </thead>
                        <tbody id="comparison-table-body"></tbody>
                    </table>
                </div>

                <section class="ranking-section" aria-labelledby="ranking-heading">
                    <div class="ranking-toolbar">
                        <h2 id="ranking-heading">Ranking detail</h2>
                        <label for="comparison-query-select">Query</label>
                        <select id="comparison-query-select"></select>
                    </div>
                    <div id="ranking-comparison" class="ranking-comparison" aria-live="polite"></div>
                </section>
                <footer id="comparison-provenance" class="provenance"></footer>
            </section>
        </main>
    </div>
    <noscript><p class="noscript">This recorded graph viewer requires JavaScript.</p></noscript>
</body>
</html>
