<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore code relationships and compare retrieval quality.">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#145fe4">
    <title>Code Knowledge Graph</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="app-identity" href="#view=explore" aria-label="Code Knowledge Graph home">
                <span class="brand-mark" aria-hidden="true">ckg</span>
                <strong>Code Knowledge Graph</strong>
            </a>
            <nav class="app-tabs" aria-label="Application views">
                <button id="explore-tab" type="button" data-view="explore" aria-pressed="true" aria-controls="explore-view">Explore</button>
                <button id="evaluation-tab" type="button" data-view="evaluation" aria-pressed="false" aria-controls="evaluation-view">Evaluation</button>
            </nav>
        </header>

        <main class="app-main" id="app-main">
            <div id="loading-state" class="loading-state" role="status">Loading recorded graph data…</div>
            <div id="error-state" class="error-state" role="alert" hidden></div>

            <section id="explore-view" class="app-view" aria-labelledby="explore-tab" data-view-panel="explore" hidden>
                <div class="query-header">
                    <h1 id="query-question">Select a query.</h1>
                    <label class="query-picker">Query <select id="query-select" aria-label="Query selector"></select></label>
                </div>

                <div class="explore-layout">
                    <section class="graph-card" aria-labelledby="query-question">
                        <div class="graph-toolbar">
                            <fieldset id="edge-filters" class="relationship-filter">
                                <legend>Relationships</legend>
                                <div id="edge-filter-list" class="filter-list"></div>
                            </fieldset>
                            <label class="score-filter">
                                <span>Minimum edge strength <output id="score-output" for="score-filter">All</output></span>
                                <input id="score-filter" type="range" min="0" max="1" step="1" value="0">
                            </label>
                            <div class="graph-view-controls">
                                <output id="graph-count" role="status" aria-live="polite"></output>
                                <div class="graph-actions" role="group" aria-label="Graph view controls">
                                    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
                                    <output id="zoom-output" aria-live="polite">100%</output>
                                    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
                                    <button id="zoom-reset" type="button" aria-label="Fit graph to view">Fit</button>
                                </div>
                            </div>
                        </div>
                        <div id="graph-stage" class="graph-stage" tabindex="0" role="region" aria-label="Interactive graph. Drag to pan, use controls to zoom, and select nodes or paths for details.">
                            <svg id="graph-svg" viewBox="0 0 1000 620" role="group" aria-labelledby="graph-title graph-description">
                                <title id="graph-title">Code relationship graph</title>
                                <desc id="graph-description">Select a node or relationship to inspect its details.</desc>
                                <g id="graph-viewport"></g>
                            </svg>
                        </div>
                    </section>

                    <aside class="results-rail" aria-label="Graph results and selection details">
                        <section class="inspector-card" aria-labelledby="inspector-heading">
                            <h2 id="inspector-heading">Details</h2>
                            <div id="inspector-content" class="inspector-content">Select a node or relationship.</div>
                        </section>
                        <section class="results-card" aria-labelledby="ranked-heading">
                            <h2 id="ranked-heading">Results</h2>
                            <div id="ranked-results" class="ranked-results" tabindex="0" role="region" aria-label="Ranked relevant and related results"></div>
                            <details class="path-picker">
                                <summary>Strongest paths</summary>
                                <div id="path-list" class="path-list"></div>
                            </details>
                        </section>
                    </aside>
                </div>
            </section>

            <section id="evaluation-view" class="app-view" aria-labelledby="evaluation-tab" data-view-panel="evaluation" hidden>
                <h1 class="visually-hidden">Evaluation</h1>
                <section id="metric-grid" class="metric-grid" aria-label="Evaluation metrics"></section>
                <p id="evaluation-conclusion" class="evaluation-conclusion"></p>
                <details class="misses-card">
                    <summary>Query-level differences</summary>
                    <div id="misses-list" class="misses-list"></div>
                </details>
            </section>

            <footer id="explore-provenance" class="provenance-bar"></footer>
        </main>
    </div>
    <noscript><p class="noscript">This recorded graph viewer requires JavaScript.</p></noscript>
</body>
</html>
