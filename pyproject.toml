[project]
name = "code-knowledge-graph"
version = "0.1.0"
description = "Explainable, reproducible code context retrieval for developers and AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipython>=8.30,<10",
    "jupyterlab>=4.1,<5",
    "kaleido>=1,<2",
    "networkx>=3.4,<4",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "scikit-learn>=1.6,<2",
]

[project.scripts]
code-knowledge-graph = "code_knowledge_graph.cli:main"

[project.urls]
Repository = "https://github.com/genesobolev/code-knowledge-graph"

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "types-networkx>=3.4,<4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
