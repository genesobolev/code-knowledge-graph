[project]
name = "code-knowledge-graph-notebook"
version = "0.1.0"
description = "A local, interactive code knowledge graph notebook"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipython>=8.30,<10",
    "jupyterlab>=4.1,<5",
    "networkx>=3.4,<4",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "types-networkx>=3.4,<4",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
